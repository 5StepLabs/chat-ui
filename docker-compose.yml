
version: "3.8"
services:
  chat-ui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: prod  # Set a default NODE_ENV
      LOG_LEVEL: "info"
      MONGODB_URL: "mongodb://mongodb:27017/chat-ui"

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  llama:
    build:
      context: .
      dockerfile: Dockerfile.llama
    ports:
      - "8080:8080"
    volumes:
      - llama_models:/app/models
    cpus: 4

volumes:
  mongodb_data:
  llama_models: